<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About / Contact — JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
  min-height: 100vh;
  background: #08090b;
  color: #fff;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
               'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  padding: 32px 40px;

  display: flex;
  flex-direction: column;
}

    /* HEADER */

    header {
      position: relative;
      height: 70px;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
      text-align: center;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
    }

    /* MENU */

    .menu {
      position: absolute;
      top: 0;
      right: 0;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      padding: 7px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 24px;
      height: 1px;
      background: #fff;
      transition: all 0.3s ease;
    }

    .menu-button:hover span {
      background: #dbe8ff;
      box-shadow: 0 0 8px #183a75;
    }

    .menu-links {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      width: max-content;
      text-align: right;
    }

    .menu-links a {
      display: block;
      margin-bottom: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .menu-links a:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    .menu.open .menu-links {
      display: block;
    }

    /* ABOUT / CONTACT */

    .about {
  width: min(700px, 90vw);
  margin: 12vh auto 0;
  padding-bottom: 15vh;
  flex: 1;
}

    .about-title {
      font-size: 1rem;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
    }

    .about-section {
      margin-bottom: 50px;
    }

    .about-section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .about-section p {
      color: #aaa;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.7;
    }

    .contact-link {
      color: #aaa;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .contact-link:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    /* FOOTER */

    footer {
      width: min(1100px, 90vw);
      margin: 0 auto;
      padding-bottom: 32px;
      text-align: center;
      color: #444;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 24px;
      }

      header {
        height: 60px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .logo-films {
        font-size: 0.7rem;
        margin-top: 7px;
      }

      .about {
        margin-top: 15vh;
      }

      .about-section {
        margin-bottom: 40px;
      }
    }
  </style>
</head>

<body>

  <header>

    <!-- CENTER LOGO -->

    <a href="jazzclubfilms.html" class="logo">
      <span class="logo-main">JAZZCLUB</span>
      <span class="logo-films">films</span>
    </a>

    <!-- RIGHT MENU -->

    <div class="menu">

      <button class="menu-button" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="menu-links">
        <a href="films.html">FEATURED FILM</a>
        <a href="filmarchive.html">ALL FILMS</a>
      </div>

    </div>

  </header>


  <main class="about">


    <section class="about-section">

      <h2>ABOUT</h2>

      <p>
        Independent documentary films.
      </p>

    </section>


    <section class="about-section">

      <h2>CONTACT</h2>

      <p>
        jch@jazzclubfilms.com
      </p>

    </section>


  </main>


  <footer>
    JazzClub Films © 2026
  </footer>


  <script>
    const menu = document.querySelector('.menu');
    const menuButton = document.querySelector('.menu-button');

    menuButton.addEventListener('click', function () {
      const isOpen = menu.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', isOpen);
    });
  </script>

</body>
</html>
