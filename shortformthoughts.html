<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT - Justin C Hedge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #a3a3a3; }
        h1 { font-family: 'Playfair Display', serif; }
        
        #mobile-menu { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #mobile-menu.open { transform: translateX(0); }
        .menu-overlay { opacity: 0; visibility: hidden; transition: 0.3s ease; }
        .menu-overlay.open { opacity: 1; visibility: visible; }
        
        .aphorism-card { border-left: 1px solid rgba(255, 255, 255, 0.1); }
        select:focus, input:focus { outline: none; border-color: rgba(255, 255, 255, 0.3); }
        
        /* Mobile optimization for scroll */
        body.overflow-hidden { overflow: hidden; }
    </style>
</head>
<body class="antialiased selection:bg-white/20">

    <header class="fixed top-0 left-0 w-full z-[60] mix-blend-difference">
        <div class="container mx-auto px-6 py-8 flex justify-between items-center">
            <a href="index.html" class="group">
                <h1 class="text-2xl font-bold text-white tracking-tighter">Justin C Hedge</h1>
            </a>
            <button id="menu-toggle" class="text-white p-2 focus:outline-none" aria-label="Toggle Menu">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8h16M4 16h16"></path></svg>
            </button>
        </div>
    </header>

    <div id="overlay" class="menu-overlay fixed inset-0 bg-black/80 backdrop-blur-sm z-[70]"></div>
    <nav id="mobile-menu" class="fixed top-0 right-0 h-full w-full max-w-sm bg-[#0a0a0a] z-[80] border-l border-white/5 flex flex-col p-12">
        <button id="menu-close" class="absolute top-8 right-8 text-white">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="mt-20 space-y-8">
            <a href="index.html" class="block text-4xl font-bold text-white hover:text-gray-400 transition-colors">Home</a>
            <a href="writings.html" class="block text-4xl font-bold text-white hover:text-gray-400 transition-colors">Writings</a>
            <a href="bookclub.html" class="block text-4xl font-bold text-white hover:text-gray-400 transition-colors">Book Club</a>
            <a href="jazzclub.html" class="block text-4xl font-bold text-white hover:text-gray-400 transition-colors">Jazz Club</a>
            <a href="books.html" class="block text-4xl font-bold text-white hover:text-gray-400 transition-colors">Books I've Read</a>        
            <a href="aphorisms.html" class="block text-4xl font-bold text-white hover:text-gray-400 transition-colors underline decoration-white/20 underline-offset-8">Shortform Thoughts</a>
        </div>
    </nav>

    <main class="min-h-screen pt-40 pb-24">
        <article class="container mx-auto px-6 max-w-2xl">
            <div class="mb-16">
                <h1 class="text-5xl text-white font-bold">Shortform Thoughts</h1>
            </div>

            <div class="flex flex-col gap-4 mb-12">
                <input type="text" id="search-input" placeholder="Search..." class="bg-white/5 border border-white/10 text-white px-4 py-2 rounded focus:border-white/30 w-full">
                
                <div class="flex flex-wrap gap-4">
                    <select id="sort-select" class="bg-white/5 border border-white/10 text-white px-4 py-2 rounded w-full md:w-auto">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="year">By Year</option>
                    </select>

                    <select id="year-select" class="hidden bg-white/5 border border-white/10 text-white px-4 py-2 rounded w-full md:w-auto">
                        <option value="">Select Year</option>
                    </select>

                    <select id="month-select" class="hidden bg-white/5 border border-white/10 text-white px-4 py-2 rounded w-full md:w-auto">
                        <option value="">Select Month</option>
                        <option value="01">January</option><option value="02">February</option>
                        <option value="03">March</option><option value="04">April</option>
                        <option value="05">May</option><option value="06">June</option>
                        <option value="07">July</option><option value="08">August</option>
                        <option value="09">September</option><option value="10">October</option>
                        <option value="11">November</option><option value="12">December</option>
                    </select>
                </div>
            </div>

            <div id="aphorisms-list" class="space-y-16">
            </div>
        </article>
    </main>

    <script>
        const aphorisms = [
            { id: 1, text: "", date: "2026-01-15" },
        ];

        const menuToggle = document.getElementById('menu-toggle');
        const menuClose = document.getElementById('menu-close');
        const mobileMenu = document.getElementById('mobile-menu');
        const overlay = document.getElementById('overlay');
        const list = document.getElementById('aphorisms-list');
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const yearSelect = document.getElementById('year-select');
        const monthSelect = document.getElementById('month-select');

        function toggleMenu() {
            mobileMenu.classList.toggle('open');
            overlay.classList.toggle('open');
            document.body.classList.toggle('overflow-hidden');
        }
        menuToggle.addEventListener('click', toggleMenu);
        menuClose.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        const years = [...new Set(aphorisms.map(a => a.date.split('-')[0]))].sort((a,b) => b - a);
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            yearSelect.appendChild(opt);
        });

        function render(data) {
            list.innerHTML = data.map(item => `
                <div class="aphorism-card pl-6">
                    <p class="text-lg md:text-xl text-white font-normal leading-relaxed mb-3">${item.text}</p>
                    <div class="flex gap-4 text-xs uppercase tracking-widest text-white/20">
                        <span>#${item.id}</span>
                        <span>${item.date}</span>
                    </div>
                </div>
            `).join('');
        }

        function update() {
            let filtered = [...aphorisms];
            const term = searchInput.value.toLowerCase();
            filtered = filtered.filter(item => item.text.toLowerCase().includes(term));
            const sortVal = sortSelect.value;

            if (sortVal === 'newest') {
                yearSelect.classList.add('hidden');
                monthSelect.classList.add('hidden');
                filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
            } else if (sortVal === 'oldest') {
                yearSelect.classList.add('hidden');
                monthSelect.classList.add('hidden');
                filtered.sort((a,b) => new Date(a.date) - new Date(b.date));
            } else if (sortVal === 'year') {
                yearSelect.classList.remove('hidden');
                const selectedYear = yearSelect.value;
                if (selectedYear) {
                    monthSelect.classList.remove('hidden');
                    filtered = filtered.filter(item => item.date.startsWith(selectedYear));
                    const selectedMonth = monthSelect.value;
                    if (selectedMonth) {
                        filtered = filtered.filter(item => item.date.split('-')[1] === selectedMonth);
                    }
                } else {
                    monthSelect.classList.add('hidden');
                }
            }
            render(filtered);
        }

        [searchInput, sortSelect, yearSelect, monthSelect].forEach(el => el.addEventListener('input', update));
        render(aphorisms);
    </script>
</body>
</html>
