        const searchInput = document.getElementById('search-input');
        const booksTimeline = document.getElementById('books-timeline');
        const emptyState = document.getElementById('empty-state');

        function renderBooks() {
            const query = searchInput.value.toLowerCase().trim();
            booksTimeline.innerHTML = '';

            // Filter books by query
            const filtered = booksData.filter(book => {
                return book.title.toLowerCase().includes(query) || 
                       book.author.toLowerCase().includes(query);
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Group filtered books by Read Year
            const grouped = {};
            filtered.forEach(book => {
                let readYear = "Undated";
                if (book.dateRead && book.dateRead.trim() !== "") {
                    const match = book.dateRead.match(/^(\d{4})/);
                    if (match) {
                        readYear = match[1];
                    }
                }
                if (!grouped[readYear]) {
                    grouped[readYear] = [];
                }
                grouped[readYear].push(book);
            });

            // Get years sorted descending (highest year/undated first)
            const sortedYears = Object.keys(grouped).sort((a, b) => {
                if (a === "Undated") return 1; // Put Undated at the bottom
                if (b === "Undated") return -1;
                return parseInt(b) - parseInt(a);
            });

            // For each year group, output a heading and its list
            sortedYears.forEach(year => {
                const yearSection = document.createElement('div');
                yearSection.className = "mb-12";

                // Year Heading
                const heading = document.createElement('h3');
                heading.className = "text-2xl md:text-3xl font-bold text-white border-b border-white/10 pb-3 mb-6 tracking-tight";
                heading.textContent = year;
                yearSection.appendChild(heading);

                // Books UL
                const ul = document.createElement('ul');
                ul.className = "space-y-8";

                // Populate books for this year
                grouped[year].forEach(book => {
                    const li = document.createElement('li');
                    li.className = "py-4 border-b border-white/5 flex flex-col md:flex-row md:items-baseline md:justify-between gap-1 md:gap-4 select-text";
                    
                    li.innerHTML = `
                        <div class="flex-grow">
                            <span class="text-white text-lg font-medium tracking-tight serif-font block md:inline">${book.title}</span>
                            <span class="text-gray-500 text-sm font-light md:ml-2">by</span>
                            <span class="text-gray-400 italic text-sm md:text-base ml-1">${book.author}</span>
                        </div>
                        <div class="text-xs text-gray-600 font-light flex-shrink-0 tracking-wider">
                            ${book.publisher} &bull; ${book.pages} pages
                        </div>
                    `;
                    ul.appendChild(li);
                });

                yearSection.appendChild(ul);
                booksTimeline.appendChild(yearSection);
            });
        }

        // Handle Search Inputs
        searchInput.addEventListener('input', renderBooks);

        // Initial setup
        window.onload = function() {
            renderBooks();

            // Setup scroll reveal animation observers matching other pages
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animationPlayState = 'running';
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.animate-reveal').forEach(el => observer.observe(el));
        };
    </script>
</body>
</html>
