<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 32px 40px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .logo {
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
      margin-left: 0.35em;
    }

    .all-films {
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .all-films:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    .featured {
      width: min(1100px, 90vw);
      margin: 15vh auto 0;
    }

    .featured-label {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.12em;
      margin-bottom: 20px;
    }

    .featured-film {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .featured-film:hover .film-info {
      opacity: 1;
    }

    .film-info {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 30px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .film-title {
      font-size: 2rem;
      font-weight: 800;
    }

    .film-description {
      margin-top: 8px;
      color: #aaa;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .featured {
        margin-top: 20vh;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">
      <span class="logo-main">JAZZCLUB</span>
      <span class="logo-films">films</span>
    </a>

    <a href="#" class="all-films">ALL FILMS</a>
  </header>

  <main class="featured">
    <div class="featured-label">Featured Film</div>

    <a href="#" class="featured-film">
      <!-- Put your film image/video here later -->

      <div class="film-info">
        <div class="film-title">Featured Film</div>
        <div class="film-description">
          A film from JazzClub Films.
        </div>
      </div>
    </a>
  </main>

</body>
</html>
