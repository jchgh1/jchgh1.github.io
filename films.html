<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      padding: 32px 40px;
    }

    footer {
  width: min(1100px, 90vw);
  margin: 0 auto;
  padding-bottom: 32px;
  text-align: center;
  color: #444;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
}

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .logo {
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
      margin-left: 0;
      text-align: center;
    }

    .all-films {
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .all-films:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

 .featured {
  width: min(1100px, 90vw);
  margin: 12vh auto 0;
  padding-bottom: 15vh;
}

   .featured-label {
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  font-size: 1rem;
  letter-spacing: 0.12em;
  margin-bottom: 32px;
}

    .featured-film {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;

      border: 1px solid #222;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .featured-film:hover {
      border-color: #183a75;
      box-shadow:
        0 0 8px #183a75,
        0 0 20px rgba(24, 58, 117, 0.7),
        0 0 40px rgba(6, 26, 61, 0.6);
    }

    .featured-film:hover .film-info {
      opacity: 1;
    }

    .film-info {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 30px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .film-title {
      font-size: 2rem;
      font-weight: 800;
    }

    .film-description {
      margin-top: 8px;
      color: #aaa;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .featured {
        margin-top: 15vh;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="jazzclubfilms.html" class="logo">
      <span class="logo-main">JAZZCLUB</span>
      <span class="logo-films">films</span>
    </a>

    <a href="filmarchive.html" class="all-films">ALL FILMS</a>
  </header>

  <main class="featured">
    <div class="featured-label">FEATURED FILM</div>

    <a href="#" class="featured-film">

      <div class="film-info">
        <div class="film-title">TBD</div>
        <div class="film-description">
          JazzClub Films first film is still currently in development.
        </div>
      </div>

    </a>
    
  </main>
  <footer>
  JazzClub Films © 2026
</footer>
  
</body>
</html>
