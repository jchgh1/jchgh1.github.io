<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Hedge Video Archive</title>

<style>
  :root {
    --cream: #F2EDE3;
    --ink: #2B2823;
    --ink-soft: #6B6559;
    --line: #DCD5C4;
    --accent: #8A7551;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  body {
    min-height: 100vh;
    padding: 48px 56px 80px;
  }

  h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.2px;
    margin: 0 0 56px;
    text-align: left;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 32px 24px;
  }

  .card {
    cursor: pointer;
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #E6DFCE;
    border-radius: 4px;
    overflow: hidden;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(43, 40, 35, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card:hover .play-badge {
    opacity: 1;
  }

  .play-badge::after {
    content: '';
    border-style: solid;
    border-width: 8px 0 8px 13px;
    border-color: transparent transparent transparent #F2EDE3;
    margin-left: 3px;
  }

  .video-title {
    margin-top: 10px;
    font-size: 14.5px;
    line-height: 1.35;
    color: var(--ink);
  }

  .empty {
    color: var(--ink-soft);
    font-size: 15px;
    padding-top: 40px;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 15, 0.9);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .overlay.open {
    display: flex;
  }

  .overlay-inner {
    width: 100%;
    max-width: 1000px;
  }

  .overlay-inner .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .overlay-inner iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .overlay-close {
    display: block;
    margin: 0 0 12px auto;
    background: none;
    border: none;
    color: var(--cream);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    cursor: pointer;
    opacity: 0.8;
  }

  .overlay-close:hover {
    opacity: 1;
  }

  @media (max-width: 700px) {
    body {
      padding: 32px 24px 60px;
    }

    h1 {
      margin-bottom: 36px;
    }

    .grid {
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .overlay {
      padding: 20px;
    }
  }
</style>
</head>

<body>

<h1>Justin Hedge Video Archive</h1>

<div id="grid" class="grid"></div>

<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <button class="overlay-close" id="overlayClose">close ×</button>
    <div class="player" id="player"></div>
  </div>
</div>

<script>
/* ============================================================
   HOW TO ADD A VIDEO

   Paste the full YouTube iframe embed code as a new string in
   the VIDEOS array below, then commit.

   The video ID and title are automatically extracted.

   Example:

   '<iframe src="https://www.youtube.com/embed/VIDEO_ID"
   title="Your Video Title"
   ...></iframe>',

   ============================================================ */

const VIDEOS = [

  '<iframe width="1440" height="617" src="https://www.youtube.com/embed/om5hhYVbiDc?list=PLBNx_wf49Wao" title="Eyeless in Gaza - Jazz Club Book Discussions" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',

  // Add more iframe strings above this line, separated by commas.

];

/* ============================================================ */

function extractId(input) {
  const m =
    input.match(/embed\/([a-zA-Z0-9_-]{11})/) ||
    input.match(/[?&]v=([a-zA-Z0-9_-]{11})/) ||
    input.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);

  return m ? m[1] : null;
}

function extractTitle(input) {
  const m = input.match(/title="([^"]*)"/);
  return m ? m[1] : null;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  const grid = document.getElementById('grid');

  const parsed = VIDEOS
    .map(raw => ({
      id: extractId(raw),
      title: extractTitle(raw)
    }))
    .filter(v => v.id);

  if (parsed.length === 0) {
    grid.innerHTML =
      '<div class="empty">No videos yet. Paste an iframe into the VIDEOS array in the source code.</div>';
    return;
  }

  grid.innerHTML = '';

  [...parsed].reverse().forEach(v => {
    const card = document.createElement('div');
    card.className = 'card';

    const title = v.title
      ? escapeHtml(v.title)
      : v.id;

    card.innerHTML = `
      <div class="thumb-wrap">
        <img
          src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg"
          alt="${title}"
          loading="lazy"
        >
        <div class="play-badge"></div>
      </div>

      <div class="video-title">
        ${title}
      </div>
    `;

    card.addEventListener('click', () => openPlayer(v.id));

    grid.appendChild(card);
  });
}

function openPlayer(id) {
  const player = document.getElementById('player');

  player.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${id}?autoplay=1"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  `;

  document.getElementById('overlay').classList.add('open');
}

function closePlayer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('player').innerHTML = '';
}

document
  .getElementById('overlayClose')
  .addEventListener('click', closePlayer);

document
  .getElementById('overlay')
  .addEventListener('click', (e) => {
    if (e.target.id === 'overlay') {
      closePlayer();
    }
  });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePlayer();
  }
});

render();
</script>

</body>
</html>
