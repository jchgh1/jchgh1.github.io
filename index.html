<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Hedge</title>
<style>
  :root {
    --cream: #F2EDE3;
    --ink: #2B2823;
    --ink-soft: #6B6559;
    --line: #DCD5C4;
    --accent: #8A7551;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 48px 24px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.2px;
    margin: 0 0 8px;
  }

  p {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 40px;
  }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .nav-btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: transparent;
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 16px;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-btn:hover {
    background: var(--ink);
    color: var(--cream);
  }
</style>
</head>

<body>

<div class="container">
  <h1>Justin Hedge</h1>
  <p>email - justinchedge@justinchedge.com</p>

  <nav class="nav-list">
    <a href="videos.html" class="nav-btn">videos</a>
    <a href="writings.html" class="nav-btn">writings</a>
    <a href="music.html" class="nav-btn">music</a>
  </nav>
</div>

</body>
</html>
