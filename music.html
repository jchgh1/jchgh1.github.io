<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Hedge Music Archive</title>
<style>
  :root {
    --cream: #F2EDE3;
    --ink: #2B2823;
    --ink-soft: #6B6559;
    --line: #DCD5C4;
    --accent: #8A7551;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  body {
    min-height: 100vh;
    padding: 48px 56px 80px;
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 56px;
  }

  .header-titles h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.2px;
    margin: 0 0 8px;
  }

  .header-titles p {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
  }

  .nav-group {
    display: flex;
    gap: 12px;
  }

  .nav-btn {
    display: inline-block;
    padding: 8px 16px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: transparent;
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .nav-btn:hover {
    background: var(--ink);
    color: var(--cream);
  }

  .music-list {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .track-card {
    background: #E6DFCE;
    padding: 24px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .track-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .track-title {
    font-size: 18px;
    font-weight: 400;
    color: var(--ink);
    margin: 0;
  }

  .track-date {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .track-desc {
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 16px;
    line-height: 1.4;
  }

  audio {
    width: 100%;
    height: 40px;
    outline: none;
  }

  .empty {
    color: var(--ink-soft);
    font-size: 15px;
    padding-top: 40px;
  }

  @media (max-width: 700px) {
    body {
      padding: 32px 24px 60px;
    }

    header {
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }

    .nav-group {
      width: 100%;
      justify-content: flex-start;
    }
  }
</style>
</head>

<body>

<header>
  <div class="header-titles">
    <h1>Justin Hedge Music Archive</h1>
    <p>email - justinchedge@justinchedge.com</p>
  </div>
  <div class="nav-group">
    <a href="videos.html" class="nav-btn">videos</a>
    <a href="writings.html" class="nav-btn">writings</a>
  </div>
</header>

<div id="musicList" class="music-list"></div>

<script>
const MUSIC = [
  {
    title: "Late Night Trio Session",
    date: "August 2026",
    src: "audio/session-one.mp3",
    description: "An improvised jazz recording exploring minor modal changes."
  },
  {
    title: "Ambient Sketch No. 4",
    date: "July 2026",
    src: "audio/ambient-sketch.mp3",
    description: "Minimalist tone patterns recorded with room mics."
  }
];

function renderMusic() {
  const container = document.getElementById('musicList');

  if (MUSIC.length === 0) {
    container.innerHTML = '<div class="empty">No music tracks yet. Add items to the MUSIC array in the source code.</div>';
    return;
  }

  container.innerHTML = '';

  [...MUSIC].reverse().forEach(track => {
    const div = document.createElement('div');
    div.className = 'track-card';

    div.innerHTML = `
      <div class="track-header">
        <h2 class="track-title">${escapeHtml(track.title)}</h2>
        <span class="track-date">${escapeHtml(track.date)}</span>
      </div>
      ${track.description ? `<p class="track-desc">${escapeHtml(track.description)}</p>` : ''}
      <audio controls preload="none">
        <source src="${escapeHtml(track.src)}" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    `;

    container.appendChild(div);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

renderMusic();
</script>

</body>
</html>
