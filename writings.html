<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Hedge Writing Archive</title>
<style>
  :root {
    --cream: #F2EDE3;
    --ink: #2B2823;
    --ink-soft: #6B6559;
    --line: #DCD5C4;
    --accent: #8A7551;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  body {
    min-height: 100vh;
    padding: 48px 56px 80px;
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 56px;
  }

  .header-titles h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.2px;
    margin: 0 0 8px;
  }

  .header-titles p {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
  }

  .nav-group {
    display: flex;
    gap: 12px;
  }

  .nav-btn {
    display: inline-block;
    padding: 8px 16px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: transparent;
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .nav-btn:hover {
    background: var(--ink);
    color: var(--cream);
  }

  .writings-list {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .writing-item {
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }

  .writing-item:last-child {
    border-bottom: none;
  }

  .writing-title-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    display: block;
    margin-bottom: 6px;
    line-height: 1.3;
    transition: color 0.15s ease;
  }

  .writing-title-btn:hover {
    color: var(--accent);
  }

  .writing-date {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .writing-excerpt {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0;
  }

  .empty {
    color: var(--ink-soft);
    font-size: 15px;
    padding-top: 40px;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 15, 0.85);
    z-index: 50;
    overflow-y: auto;
    padding: 40px 20px;
  }

  .overlay.open {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .overlay-content {
    background: var(--cream);
    color: var(--ink);
    width: 100%;
    max-width: 700px;
    padding: 48px;
    border-radius: 4px;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    margin: 40px 0;
  }

  .overlay-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    cursor: pointer;
    opacity: 0.7;
  }

  .overlay-close:hover {
    opacity: 1;
  }

  .modal-title {
    font-size: 24px;
    font-weight: 400;
    margin: 0 0 8px;
  }

  .modal-date {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }

  .modal-body {
    font-size: 15.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  @media (max-width: 700px) {
    body {
      padding: 32px 24px 60px;
    }

    header {
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }

    .nav-group {
      width: 100%;
      justify-content: flex-start;
    }

    .overlay-content {
      padding: 24px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="header-titles">
    <h1>Justin Hedge Writing Archive</h1>
    <p>email - justinchedge@justinchedge.com</p>
  </div>
  <div class="nav-group">
    <a href="videos.html" class="nav-btn">videos</a>
    <a href="music.html" class="nav-btn">music</a>
  </div>
</header>

<div id="writingsList" class="writings-list"></div>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <button class="overlay-close" id="overlayClose">close ×</button>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const WRITINGS = [
  {
    title: "On the Architecture of Modern Spaces",
    date: "August 2026",
    excerpt: "Reflections on structural layout, minimalism, and the shift from ornamentation to functional lines in urban skylines.",
    content: "Reflections on structural layout, minimalism, and the shift from ornamentation to functional lines in urban skylines.\n\nArchitecture has always communicated values before it communicates utility. When walking through commercial corridors, the dialogue between Postmodernism and the International Style reveals our shifting anxieties regarding permanence versus modular flexibility. Every facade tells a story of structural necessity meeting aesthetic restraint."
  },
  {
    title: "Notes on Screenplay Structure & Rhythm",
    date: "July 2026",
    excerpt: "Examining pacing, dialogue cadence, and how to build subtext naturally into scene transitions.",
    content: "Examining pacing, dialogue cadence, and how to build subtext naturally into scene transitions.\n\nSubtext is the lifeblood of memorable cinema. When characters speak directly to their desires, the dramatic tension evaporates. True momentum lives in the pauses, the averted gazes, and the structural cadence of alternating dialogue beats."
  }
];

function renderWritings() {
  const container = document.getElementById('writingsList');

  if (WRITINGS.length === 0) {
    container.innerHTML = '<div class="empty">No writings yet. Add items to the WRITINGS array in the source code.</div>';
    return;
  }

  container.innerHTML = '';

  [...WRITINGS].reverse().forEach((item, index) => {
    const originalIndex = WRITINGS.length - 1 - index;
    
    const div = document.createElement('div');
    div.className = 'writing-item';

    div.innerHTML = `
      <button class="writing-title-btn" onclick="openModal(${originalIndex})">${escapeHtml(item.title)}</button>
      <div class="writing-date">${escapeHtml(item.date)}</div>
      <p class="writing-excerpt">${escapeHtml(item.excerpt)}</p>
    `;

    container.appendChild(div);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openModal(index) {
  const item = WRITINGS[index];
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalDate').textContent = item.date;
  document.getElementById('modalBody').textContent = item.content;

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = 'auto';
}

document.getElementById('overlayClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') {
    closeModal();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
  }
});

renderWritings();
</script>

</body>
</html>
