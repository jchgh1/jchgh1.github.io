<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Archive — JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #08090b;
      color: #fff;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      padding: 32px 40px;
    }

    /* HEADER */

    header {
      position: relative;
      height: 70px;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
      text-align: center;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
    }

    /* MENU */

    .menu {
      position: absolute;
      top: 0;
      right: 0;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      padding: 7px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 24px;
      height: 1px;
      background: #fff;
      transition:
        background 0.4s ease,
        box-shadow 0.4s ease;
    }

    .menu-button:hover span {
      background: #fff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
    }

    .menu-links {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      width: max-content;
      text-align: right;
    }

    .menu-links a {
      display: block;
      margin-bottom: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition:
        color 0.3s ease,
        text-shadow 0.3s ease;
    }

    .menu-links a:hover {
      color: #ddd;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .menu.open .menu-links {
      display: block;
    }

    /* ARCHIVE */

    .archive {
      width: min(1100px, 90vw);
      margin: 12vh auto 0;
      padding-bottom: 15vh;
    }

    .archive-title {
      font-size: 1rem;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
    }

    .film-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 50px 30px;
    }

    /* FILM */

    .film {
      text-decoration: none;
      color: #fff;
      display: block;

      transition:
        transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .film-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      position: relative;

      border: 1px solid #222;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.5);

      transition:
        border-color 0.5s ease,
        box-shadow 0.5s ease;
    }

    /* HAPTIC / PHYSICAL HOVER */

    .film:hover {
      transform: translateY(-2px);
    }

    .film:hover .film-image {
      border-color: #444;

      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.35),
        0 20px 55px rgba(0, 0, 0, 0.75);
    }

    /* THUMBNAIL */

    .film-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.6s ease;
      pointer-events: none;
    }

    .film:hover .film-image::after {
      background: rgba(255, 255, 255, 0.025);
    }

    /* FILM INFO */

    .film-info {
      padding-top: 14px;
    }

    .film-title {
      font-size: 1.15rem;
      font-weight: normal;

      transition:
        color 0.4s ease,
        transform 0.4s ease;
    }

    .film:hover .film-title {
      color: #ddd;
      transform: translateX(2px);
    }

    .film-year {
      margin-top: 5px;
      color: #777;
      font-size: 0.8rem;
      letter-spacing: 0.08em;

      transition:
        color 0.4s ease,
        transform 0.4s ease;
    }

    .film:hover .film-year {
      color: #999;
      transform: translateX(2px);
    }

    /* FOOTER */

    footer {
      width: min(1100px, 90vw);
      margin: 0 auto;
      padding-bottom: 32px;
      text-align: center;
      color: #444;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      body {
        padding: 24px;
      }

      header {
        height: 60px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .logo-films {
        font-size: 0.7rem;
        margin-top: 7px;
      }

      .archive {
        margin-top: 15vh;
      }

      .film-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .film:hover {
        transform: translateY(-1px);
      }
    }
  </style>
</head>

<body>

  <footer>

  <script>
    const menu = document.querySelector('.menu');
    const menuButton = document.querySelector('.menu-button');

    menuButton.addEventListener('click', function () {
      const isOpen = menu.classList.toggle('open');

      menuButton.setAttribute(
        'aria-expanded',
        isOpen
      );
    });
  </script>

</body>
</html>
