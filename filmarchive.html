<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Archive — JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #08090b;
      color: #fff;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      padding: 32px 40px;
    }

    /* HEADER */

    header {
      position: relative;
      height: 70px;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
      text-align: center;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
    }

    /* MENU */

    .menu {
      position: absolute;
      top: 0;
      right: 0;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      padding: 7px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 24px;
      height: 1px;
      background: #fff;
      transition: all 0.3s ease;
    }

    .menu-button:hover span {
      background: #dbe8ff;
      box-shadow: 0 0 8px #183a75;
    }

    .menu-links {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      width: max-content;
      text-align: right;
    }

    .menu-links a {
      display: block;
      margin-bottom: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .menu-links a:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    .menu.open .menu-links {
      display: block;
    }

    /* ARCHIVE */

    .archive {
      width: min(1100px, 90vw);
      margin: 12vh auto 0;
      padding-bottom: 15vh;
    }

    .archive-title {
      font-size: 1rem;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
    }

    .film-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 50px 30px;
    }

    .film {
      text-decoration: none;
      color: #fff;
      display: block;
    }

    .film-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      position: relative;

      border: 1px solid #222;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .film:hover .film-image {
      border-color: #183a75;
      box-shadow:
        0 0 8px #183a75,
        0 0 20px rgba(24, 58, 117, 0.7),
        0 0 40px rgba(6, 26, 61, 0.6);
    }

    .film-info {
      padding-top: 14px;
    }

    .film-title {
      font-size: 1.15rem;
      font-weight: normal;
    }

    .film-year {
      margin-top: 5px;
      color: #777;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    /* FOOTER */

    footer {
      width: min(1100px, 90vw);
      margin: 0 auto;
      padding-bottom: 32px;
      text-align: center;
      color: #444;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      body {
        padding: 24px;
      }

      header {
        height: 60px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .logo-films {
        font-size: 0.7rem;
        margin-top: 7px;
      }

      .archive {
        margin-top: 15vh;
      }

      .film-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }
  </style>
</head>

<body>

  <header>

    <!-- CENTER LOGO -->

    <a href="jazzclubfilms.html" class="logo">
      <span class="logo-main">JAZZCLUB</span>
      <span class="logo-films">films</span>
    </a>

    <!-- RIGHT MENU -->

    <div class="menu">

      <button class="menu-button" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="menu-links">
        <a href="films.html">FEATURED FILM</a>
        <a href="about.html">ABOUT / CONTACT</a>
      </div>

    </div>

  </header>


  <main class="archive">

    <div class="archive-title">ALL FILMS</div>

    <div class="film-grid">

      <a href="#" class="film">
        <div class="film-image"></div>
        <div class="film-info">
          <div class="film-title">Film Title</div>
          <div class="film-year">2026</div>
        </div>
      </a>

      <a href="#" class="film">
        <div class="film-image"></div>
        <div class="film-info">
          <div class="film-title">Film Title</div>
          <div class="film-year">2026</div>
        </div>
      </a>

      <a href="#" class="film">
        <div class="film-image"></div>
        <div class="film-info">
          <div class="film-title">Film Title</div>
          <div class="film-year">2026</div>
        </div>
      </a>

      <a href="#" class="film">
        <div class="film-image"></div>
        <div class="film-info">
          <div class="film-title">Film Title</div>
          <div class="film-year">2026</div>
        </div>
      </a>

      <a href="#" class="film">
        <div class="film-image"></div>
        <div class="film-info">
          <div class="film-title">Film Title</div>
          <div class="film-year">2026</div>
        </div>
      </a>

      <a href="#" class="film">
        <div class="film-image"></div>
        <div class="film-info">
          <div class="film-title">Film Title</div>
          <div class="film-year">2026</div>
        </div>
      </a>

    </div>

  </main>


  <footer>
    JazzClub Films © 2026
  </footer>


  <script>
    const menu = document.querySelector('.menu');
    const menuButton = document.querySelector('.menu-button');

    menuButton.addEventListener('click', function () {
      const isOpen = menu.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', isOpen);
    });
  </script>

</body>
</html>
