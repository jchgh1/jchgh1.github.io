<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Club Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .title {
      text-align: center;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.9;
    }

    .films {
      display: block;
      margin-top: 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 2vw, 1.8rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.45em;
      margin-left: 0.45em;
    }
  </style>
</head>

<body>
  <div class="title">
    <h1>JAZZCLUB</h1>
    <span class="films">films</span>
  </div>
</body>
</html>
